{% extends "base.html" %}
{% block title %}First launch{% endblock %}
{% block content %}
<article style="max-width: 480px; margin: 2rem auto;">
  <header><h2 style="margin:0">First launch</h2></header>
  <p class="muted">Create the administrator account. This page goes away for good afterwards.</p>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post" action="/setup">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Login <input name="login" value="{{ login or '' }}" required autocomplete="username" autofocus></label>
    <label>Password <input type="password" name="password" required minlength="10" autocomplete="new-password"></label>
    <small class="help">At least 10 characters.</small>
    <label>Confirm password <input type="password" name="password_confirm" required minlength="10" autocomplete="new-password"></label>
    <button type="submit">Create admin account</button>
  </form>
</article>
{% endblock %}
