# Upsun configuration: Upsun builds and deploys the application from this file
# (no Docker image). Reference: https://developer.upsun.com/docs/languages/python
applications:
  app:
    # Python 3.14: the only "supported" version on Upsun (3.12/3.13 are deprecated).
    type: "python:3.14"

    source:
      root: "/"

    # Relationship to the "database" PostgreSQL service declared below (short form:
    # same name as the service, default endpoint). Upsun exposes DATABASE_HOST, DATABASE_PORT,
    # DATABASE_USERNAME, DATABASE_PASSWORD, DATABASE_PATH; the app builds the URL itself (app/config.py).
    relationships:
      database:

    variables:
      env:
        PYTHONUNBUFFERED: "1"
        COOKIE_SECURE: "true"

    hooks:
      # Build: writable file system, no access to services.
      build: |
        set -eu
        pip install --upgrade pip
        pip install -r requirements.txt
      # Deploy: runs only on the web container (not on the workers).
      deploy: |
        set -eu
        python -m alembic upgrade head

    web:
      commands:
        start: "python -m uvicorn app.asgi:application --host 0.0.0.0 --port $PORT --workers 2 --proxy-headers --forwarded-allow-ips '*'"
      locations:
        "/":
          passthru: true
        "/static":
          root: "app/static"
          expires: 1h
          allow: true

    # Worker: same code, different command. Drives the Managed Agents sessions in the background.
    # Inherits the application's relationships and variables.
    workers:
      runs:
        commands:
          start: "python -m app.worker"

services:
  # PostgreSQL service managed by Upsun (supported versions: 14 to 18).
  database:
    type: "postgresql:18"

routes:
  "https://{default}/":
    type: upstream
    upstream: "app:http"
  "https://www.{default}/":
    type: redirect
    to: "https://{default}/"
